nalism procedurile disciplinare atunci când este necesar", "monitorizează nivelul de satisfacție și implicare al personalului"]], ["4.2", "Managementul implementării curriculumului și al proceselor de evaluare", ["coordonează elaborarea și implementarea curriculumului, inclusiv a curriculumului la decizia elevului din oferta școlii", "asigură coerența verticală și orizontală a curriculumului la nivelul unității", "verifică alinierea planificărilor didactice la curriculum și oferă feedback constructiv", "monitorizează calitatea procesului didactic prin observări de lecții, analiză documentară și discuții profesionale", "monitorizează coerența și echitatea evaluării la nivel instituțional", "încurajează utilizarea evaluării formative ca instrument de îmbunătățire a învățării", "corelează datele privind rezultatele elevilor cu deciziile curriculare și de îmbunătățire", "facilitează întâlniri metodice și comunități profesionale de învățare"]], ["4.3", "Cercetare, inovație pedagogică și conceptualizare strategică", ["promovează inovația pedagogică și utilizarea metodelor activ-participative centrate pe elev", "facilitează participarea cadrelor didactice în proiecte educaționale, cercetare-acțiune și schimb de bune practici", "utilizează datele și indicatorii educaționali pentru îmbunătățirea demersurilor curriculare", "susține procesele de mentorat, coaching și observare inter pares", "facilitează accesul cadrelor didactice la programe de dezvoltare profesională relevante și de calitate"]], ["4.4", "Asigurarea succesului școlar al elevilor și a performanței cadrelor didactice", ["elaborează planuri individuale de dezvoltare profesională corelate cu nevoile identificate", "monitorizează impactul formării continue asupra practicii didactice și a rezultatelor elevilor", "asigură responsabilizarea cadrelor didactice cu privire la impactul practicilor pedagogice asupra succesului elevilor", "valorifică expertiza internă a personalului în procesele de formare și mentorat coleg nțare extrabugetară și inițiază aplicații de proiect relevante pentru nevoile școlii", "captează resurse financiare și materiale din comunitate, activând sectorul privat și neguvernamental", "utilizează tehnici de negociere și mediere în gestionarea parteneriatelor", "asigură coerența dintre obiectivele instituționale și activitățile de fundraising", "coordonează implementarea proiectelor externe și asigură continuitatea după finalizarea finanțării", "menține legătura cu comunitatea și promovează imaginea instituției la nivel local și regional", "încurajează participarea comunității în proiecte educaționale"]]]}], "values": ["Interesul superior al elevului", "Echitate, incluziune și justiție socială", "Leadership pedagogic și cultura învățării", "Etică și integritate profesională", "Inițiativă și antreprenoriat", "Parteneriat cu familia și comunitatea"], "transversal": ["Gândire critică, analitică și sistemică", "Raționament strategic și capacitate decizională", "Competențe de analiză cantitativă și utilizare a datelor", "Competențe digitale funcționale și strategice", "Competențe lingvistice și de comunicare profesională", "Inteligență emoțională, autoreglare și maturitate relațională", "Capacitate de adaptare și învățare continuă"], "quiz": [{"q": "Profilul profesional al managerului școlar este organizat pe câte domenii de competență?", "a": ["3", "5", "7", "10"], "c": 1}, {"q": "Care dintre următoarele este o valoare fundamentală a profilului?", "a": ["Interesul superior al elevului", "Competiția între profesori", "Centralizarea deciziei", "Standardizarea absolută"], "c": 0}, {"q": "În ce competență specifică apare utilizarea ciclurilor PDCA?", "a": ["1.1 Managementul schimbării", "2.2 Managementul riscului", "3.1 Evaluare internă", "5.4 Resurse extrabugetare"], "c": 0}, {"q": "Managementul riscului este inclus în domeniul:", "a": ["1", "2", "4", "5"], "c": 1}, {"q": "Standardele ARACIP apar explicit în:", "a": ["3.1 Monitorizare, evaluare internă și raportare", const app = document.getElementById("app");
const side = document.getElementById("side");
const KEY="profil_manager_done_v2";
let done=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));
const lessons=()=>DATA.domains.flatMap(d=>d.competencies.map(c=>({domain:d.id,code:c[0],title:c[1],desc:c[2]})));

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function progress(){
  const n=lessons().length,p=Math.round(done.size/n*100);
  document.getElementById("ptxt").textContent=`${done.size}/${n} • ${p}%`;
  document.getElementById("pbar").style.width=p+"%";
}
function active(page){document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));}
function go(page){active(page); side.classList.remove("open"); render(page); window.scrollTo(0,0);}
function speak(text,btn){
  if(!("speechSynthesis" in window)){alert("Browserul nu oferă sinteză vocală.");return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang="ro-RO"; u.rate=.9;
  const voices=speechSynthesis.getVoices(); const ro=voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("ro")); if(ro)u.voice=ro;
  btn.textContent="⏹ Oprește";
  u.onend=()=>btn.textContent="🔊 Ascultă";
  btn.onclick=()=>{speechSynthesis.cancel();btn.textContent="🔊 Ascultă";attachActions();};
  speechSynthesis.speak(u);
}
function home(){
 app.innerHTML=`<section class="hero"><div class="kicker">PLATFORMĂ DE STUDIU</div><h1>Profilul profesional al managerului școlar</h1>
 <p>Parcurge structurat cele 5 domenii de competență și cele 20 de competențe specifice. Ascultă fiecare lecție, fixează descriptorii comportamentali, marchează progresul și verifică-te prin test.</p>
 <div class="actions"><button class="btn primary" onclick="go('d1')">Începe cu Domeniul 1</button><button class="btn" onclick="go('map')">Vezi harta completă</button></div></section>
 <h2>Cele 5 domenii de competență</h2><div class="grid">${DATA.domains.map(d=>`<article class="card"><div class="num">0${d.id}</div><h3>${esc(d.title)}</h3><p>${esc(d.general)}</p><button class="btn" onclick="go('d${d.id}')">Deschide domeniul</button></article>`).join("")}</div>
 <div class="note">Material de studiu realizat pe baza documentului oficial. Pentru citare sau aplicare juridică/administrativă, se consultă actul normativ în forma oficială.</div>`;
}
function simple(title,intro,items,remember){
 app.innerHTML=`<h1>${esc(title)}</h1><div class="card full"><p>${esc(intro)}</p>${items?`<div class="pills">${items.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div>`:""}${remember?`<div class="callout"><b>Reține:</b> ${esc(remember)}</div>`:""}</div>`;
}
function domain(id){
 const d=DATA.domains.find(x=>x.id===id);
 app.innerHTML=`<h1>${id}. ${esc(d.title)}</h1><div class="callout"><b>Competența generală:</b> ${esc(d.general)}</div>`+
 d.competencies.map(c=>`<article class="lesson"><div class="lessonhead"><div><h3>${esc(c[0])}. ${esc(c[1])}</h3><div class="muted">Descriptori comportamentali</div></div><span class="pill">${c[2].length} descriptori</span></div>
 <ol>${c[2].map(x=>`<li>${esc(x)}</li>`).join("")}</ol><div class="lessonactions">
 <button class="btn audio" data-code="${esc(c[0])}">🔊 Ascultă</button>
 <button class="btn mark ${done.has(c[0])?"done":""}" data-code="${esc(c[0])}">${done.has(c[0])?"✓ Învățat":"Marchează ca învățat"}</button></div></article>`).join("");
 attachActions();
}
function attachActions(){
 document.querySelectorAll(".mark").forEach(b=>b.onclick=()=>{
   if(done.has(b.dataset.code))done.delete(b.dataset.code);else done.add(b.dataset.code);
   localStorage.setItem(KEY,JSON.stringify([...done])); progress();
   b.classList.toggle("done",done.has(b.dataset.code)); b.textContent=done.has(b.dataset.code)?"✓ Învățat":"Marchează ca învățat";
 });
 document.querySelectorAll(".audio").forEach(b=>b.onclick=()=>{
   const c=lessons().find(x=>x.code===b.dataset.code);
   speak(`${c.code}. ${c.title}. Descriptori comportamentali. ${c.desc.join(". ")}`,b);
 });
}
function map(){
 app.innerHTML=`<h1>Harta profilului</h1><p class="muted">Cele 5 domenii și cele 20 de competențe specifice, într-o singură vedere.</p><div style="overflow:auto"><table><thead><tr><th>Domeniu</th><th>Competență generală</th><th>Competențe specifice</th></tr></thead><tbody>${DATA.domains.map(d=>`<tr><td><b>${d.id}. ${esc(d.title)}</b></td><td>${esc(d.general)}</td><td>${d.competencies.map(c=>`<div><b>${esc(c[0])}</b> ${esc(c[1])}</div>`).join("")}</td></tr>`).join("")}</tbody></table></div>`;
}
function review(){
 app.innerHTML=`<h1>Recapitulare rapidă</h1><p class="muted">Titlurile celor 20 de competențe și ideile-cheie pentru fixare.</p><div class="grid">${DATA.domains.flatMap(d=>d.competencies.map(c=>`<article class="card wide"><div class="num">${esc(c[0])}</div><h3>${esc(c[1])}</h3><p>${esc(c[2].slice(0,2).join("; "))}.</p></article>`)).join("")}</div>`;
}
function quiz(){
 let score=0,answered=0;
 app.innerHTML=`<h1>Test final</h1><p class="muted">10 întrebări de verificare. Rezultatul apare după ultimul răspuns.</p><div id="qw"></div>`;
 const qw=document.getElementById("qw");
 DATA.quiz.forEach((q,i)=>{
  const box=document.createElement("div");box.className="qbox";
  box.innerHTML=`<b>${i+1}. ${esc(q.q)}</b><div>${q.a.map((a,j)=>`<button class="option" data-i="${j}">${esc(a)}</button>`).join("")}</div>`;
  box.querySelectorAll(".option").forEach(btn=>btn.onclick=()=>{
    if(box.dataset.answered)return;box.dataset.answered="1";answered++;
    const j=Number(btn.dataset.i);
    box.querySelectorAll(".option").forEach((x,k)=>{if(k===q.c)x.classList.add("ok");});
    if(j===q.c)score++;else btn.classList.add("bad");
    if(answered===DATA.quiz.length){
      const r=document.createElement("div");r.className="qbox";
      r.innerHTML=`<div class="score">${score}/10</div><p>${score>=9?"Excelent.":score>=7?"Foarte bine. Reia doar punctele unde ai ezitat.":"Reia domeniile înainte de o nouă testare."}</p><button class="btn primary" onclick="go('quiz')">Reia testul</button>`;
      qw.appendChild(r);
    }
  });
  qw.appendChild(box);
 });
}
function render(page){
 if(page==="home")home();
 else if(page==="context")simple("Context","Profilul profesional al managerului școlar descrie așteptările față de managerul școlar în termeni de competențe și atribuie directorului un rol profesionalizat, bazat pe competențe demonstrabile și impact măsurabil.",null,"Directorul este lider pedagogic, strategic și organizațional, cu responsabilitate integrată pentru funcționarea, dezvoltarea și performanța instituției.");
 else if(page==="values")simple("Valori fundamentale","Reperele etice și principiile care orientează exercitarea rolului managerului școlar.",DATA.values,"Valorile trebuie să fie vizibile în decizii, relații și conduită profesională.");
 else if(page==="transversal")simple("Competențe transversale","Precondiții cognitive, relaționale și profesionale necesare exercitării rolului de director.",DATA.transversal,"Competențele transversale susțin toate cele 5 domenii ale profilului.");
 else if(/^d[1-5]$/.test(page))domain(Number(page[1]));
 else if(page==="map")map();
 else if(page==="review")review();
 else if(page==="quiz")quiz();
}
document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
document.getElementById("menu").addEventListener("click",()=>side.classList.toggle("open"));
progress();render("home");
</script>
</body>
</html>
